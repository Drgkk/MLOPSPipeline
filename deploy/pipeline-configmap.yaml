apiVersion: v1
kind: ConfigMap
metadata:
  name: breast-cancer-pipeline
data:
  breast_cancer_pipeline.yaml: "# PIPELINE DEFINITION\n# Name: breast-cancer-decision-tree\n\
    # Description: Load, clean, split, train and evaluate sklearn's breast cancer\
    \ dataset.\n# Inputs:\n#    max_depth: int [Default: 5.0]\n#    random_state:\
    \ int [Default: 42.0]\n#    test_size: float [Default: 0.2]\ncomponents:\n  comp-evaluate-model:\n\
    \    executorLabel: exec-evaluate-model\n    inputDefinitions:\n      artifacts:\n\
    \        model:\n          artifactType:\n            schemaTitle: system.Model\n\
    \            schemaVersion: 0.0.1\n        test_dataset:\n          artifactType:\n\
    \            schemaTitle: system.Dataset\n            schemaVersion: 0.0.1\n \
    \   outputDefinitions:\n      artifacts:\n        confusion_matrix:\n        \
    \  artifactType:\n            schemaTitle: system.ClassificationMetrics\n    \
    \        schemaVersion: 0.0.1\n        metrics:\n          artifactType:\n   \
    \         schemaTitle: system.Metrics\n            schemaVersion: 0.0.1\n  comp-import-dataset:\n\
    \    executorLabel: exec-import-dataset\n    outputDefinitions:\n      artifacts:\n\
    \        dataset:\n          artifactType:\n            schemaTitle: system.Dataset\n\
    \            schemaVersion: 0.0.1\n  comp-preprocess-and-split:\n    executorLabel:\
    \ exec-preprocess-and-split\n    inputDefinitions:\n      artifacts:\n       \
    \ dataset:\n          artifactType:\n            schemaTitle: system.Dataset\n\
    \            schemaVersion: 0.0.1\n      parameters:\n        random_state:\n\
    \          parameterType: NUMBER_INTEGER\n        test_size:\n          parameterType:\
    \ NUMBER_DOUBLE\n    outputDefinitions:\n      artifacts:\n        test_dataset:\n\
    \          artifactType:\n            schemaTitle: system.Dataset\n          \
    \  schemaVersion: 0.0.1\n        train_dataset:\n          artifactType:\n   \
    \         schemaTitle: system.Dataset\n            schemaVersion: 0.0.1\n  comp-train-model:\n\
    \    executorLabel: exec-train-model\n    inputDefinitions:\n      artifacts:\n\
    \        train_dataset:\n          artifactType:\n            schemaTitle: system.Dataset\n\
    \            schemaVersion: 0.0.1\n      parameters:\n        max_depth:\n   \
    \       parameterType: NUMBER_INTEGER\n        random_state:\n          parameterType:\
    \ NUMBER_INTEGER\n    outputDefinitions:\n      artifacts:\n        model:\n \
    \         artifactType:\n            schemaTitle: system.Model\n            schemaVersion:\
    \ 0.0.1\ndeploymentSpec:\n  executors:\n    exec-evaluate-model:\n      container:\n\
    \        args:\n        - --executor_input\n        - '{{$}}'\n        - --function_to_execute\n\
    \        - evaluate_model\n        command:\n        - sh\n        - -c\n    \
    \    - \"\\nif ! [ -x \\\"$(command -v pip)\\\" ]; then\\n    python3 -m ensurepip\
    \ ||\\\n          \\ python3 -m ensurepip --user || apt-get install python3-pip\\\
    nfi\\n\\nPIP_DISABLE_PIP_VERSION_CHECK=1\\\n          \\ python3 -m pip install\
    \ --quiet --no-warn-script-location 'pandas==2.2.3'\\\n          \\ 'scikit-learn==1.6.1'\
    \ 'joblib==1.4.2'  &&  python3 -m pip install --quiet\\\n          \\ --no-warn-script-location\
    \ 'kfp==2.18.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\\\n          \\ python_version<\\\
    \"3.9\\\"' && \\\"$0\\\" \\\"$@\\\"\\n\"\n        - sh\n        - -ec\n      \
    \  - 'program_path=$(mktemp -d)\n\n\n          printf \"%s\" \"$0\" > \"$program_path/ephemeral_component.py\"\
    \n\n          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main             \
    \            --component_module_path                         \"$program_path/ephemeral_component.py\"\
    \                         \"$@\"\n\n          '\n        - \"\\nimport kfp\\nfrom\
    \ kfp import dsl\\nfrom kfp.dsl import *\\nfrom typing import\\\n          \\\
    \ *\\n\\ndef evaluate_model(\\n    test_dataset: Input[Dataset],\\n    model:\\\
    \n          \\ Input[Model],\\n    metrics: Output[Metrics],\\n    confusion_matrix:\
    \ Output[ClassificationMetrics],\\n\\\n          ):\\n    \\\"\\\"\\\"Evaluate\
    \ held-out data; malignant (sklearn label 0) is the\\\n          \\ positive class.\\\
    \"\\\"\\\"\\n    import joblib\\n    import pandas as pd\\n  \\\n          \\\
    \  from sklearn.metrics import (\\n        accuracy_score,\\n        classification_report,\\\
    n\\\n          \\        confusion_matrix as calculate_confusion_matrix,\\n  \
    \      f1_score,\\n\\\n          \\        precision_score,\\n        recall_score,\\\
    n        roc_auc_score,\\n\\\n          \\    )\\n\\n    test = pd.read_csv(test_dataset.path)\\\
    n    features, target\\\n          \\ = test.drop(columns=[\\\"target\\\"]), test[\\\
    \"target\\\"]\\n    classifier =\\\n          \\ joblib.load(model.path)\\n  \
    \  predictions = classifier.predict(features)\\n\\\n          \\    malignant_index\
    \ = list(classifier.classes_).index(0)\\n    malignant_probability\\\n       \
    \   \\ = classifier.predict_proba(features)[:, malignant_index]\\n\\n    scores\\\
    \n          \\ = {\\n        \\\"accuracy\\\": accuracy_score(target, predictions),\\\
    n    \\\n          \\    \\\"precision_malignant\\\": precision_score(target,\
    \ predictions, pos_label=0,\\\n          \\ zero_division=0),\\n        \\\"recall_malignant\\\
    \": recall_score(target,\\\n          \\ predictions, pos_label=0, zero_division=0),\\\
    n        \\\"f1_malignant\\\"\\\n          : f1_score(target, predictions, pos_label=0,\
    \ zero_division=0),\\n       \\\n          \\ \\\"roc_auc_malignant\\\": roc_auc_score(target\
    \ == 0, malignant_probability),\\n\\\n          \\    }\\n    for name, value\
    \ in scores.items():\\n        metrics.log_metric(name,\\\n          \\ float(value))\\\
    n    confusion_matrix.log_confusion_matrix(\\n        categories=[\\\"\\\n   \
    \       malignant\\\", \\\"benign\\\"],\\n        matrix=calculate_confusion_matrix(target,\\\
    \n          \\ predictions, labels=[0, 1]).tolist(),\\n    )\\n    print(classification_report(target,\\\
    \n          \\ predictions, labels=[0, 1],\\n                                target_names=[\\\
    \"\\\n          malignant\\\", \\\"benign\\\"], zero_division=0))\\n    print(scores)\\\
    n\\n\"\n        image: python:3.11-slim\n    exec-import-dataset:\n      container:\n\
    \        args:\n        - --executor_input\n        - '{{$}}'\n        - --function_to_execute\n\
    \        - import_dataset\n        command:\n        - sh\n        - -c\n    \
    \    - \"\\nif ! [ -x \\\"$(command -v pip)\\\" ]; then\\n    python3 -m ensurepip\
    \ ||\\\n          \\ python3 -m ensurepip --user || apt-get install python3-pip\\\
    nfi\\n\\nPIP_DISABLE_PIP_VERSION_CHECK=1\\\n          \\ python3 -m pip install\
    \ --quiet --no-warn-script-location 'pandas==2.2.3'\\\n          \\ 'scikit-learn==1.6.1'\
    \ 'joblib==1.4.2'  &&  python3 -m pip install --quiet\\\n          \\ --no-warn-script-location\
    \ 'kfp==2.18.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\\\n          \\ python_version<\\\
    \"3.9\\\"' && \\\"$0\\\" \\\"$@\\\"\\n\"\n        - sh\n        - -ec\n      \
    \  - 'program_path=$(mktemp -d)\n\n\n          printf \"%s\" \"$0\" > \"$program_path/ephemeral_component.py\"\
    \n\n          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main             \
    \            --component_module_path                         \"$program_path/ephemeral_component.py\"\
    \                         \"$@\"\n\n          '\n        - \"\\nimport kfp\\nfrom\
    \ kfp import dsl\\nfrom kfp.dsl import *\\nfrom typing import\\\n          \\\
    \ *\\n\\ndef import_dataset(dataset: Output[Dataset]):\\n    from sklearn.datasets\\\
    \n          \\ import load_breast_cancer\\n\\n    data = load_breast_cancer(as_frame=True)\\\
    n\\\n          \\    data.frame.to_csv(dataset.path, index=False)\\n    dataset.metadata[\\\
    \"\\\n          rows\\\"] = int(len(data.frame))\\n    dataset.metadata[\\\"target_names\\\
    \"] =\\\n          \\ data.target_names.tolist()\\n\\n\"\n        image: python:3.11-slim\n\
    \    exec-preprocess-and-split:\n      container:\n        args:\n        - --executor_input\n\
    \        - '{{$}}'\n        - --function_to_execute\n        - preprocess_and_split\n\
    \        command:\n        - sh\n        - -c\n        - \"\\nif ! [ -x \\\"$(command\
    \ -v pip)\\\" ]; then\\n    python3 -m ensurepip ||\\\n          \\ python3 -m\
    \ ensurepip --user || apt-get install python3-pip\\nfi\\n\\nPIP_DISABLE_PIP_VERSION_CHECK=1\\\
    \n          \\ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.2.3'\\\
    \n          \\ 'scikit-learn==1.6.1' 'joblib==1.4.2'  &&  python3 -m pip install\
    \ --quiet\\\n          \\ --no-warn-script-location 'kfp==2.18.0' '--no-deps'\
    \ 'typing-extensions>=3.7.4,<5;\\\n          \\ python_version<\\\"3.9\\\"' &&\
    \ \\\"$0\\\" \\\"$@\\\"\\n\"\n        - sh\n        - -ec\n        - 'program_path=$(mktemp\
    \ -d)\n\n\n          printf \"%s\" \"$0\" > \"$program_path/ephemeral_component.py\"\
    \n\n          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main             \
    \            --component_module_path                         \"$program_path/ephemeral_component.py\"\
    \                         \"$@\"\n\n          '\n        - \"\\nimport kfp\\nfrom\
    \ kfp import dsl\\nfrom kfp.dsl import *\\nfrom typing import\\\n          \\\
    \ *\\n\\ndef preprocess_and_split(\\n    dataset: Input[Dataset],\\n    train_dataset:\\\
    \n          \\ Output[Dataset],\\n    test_dataset: Output[Dataset],\\n    test_size:\
    \ float,\\n\\\n          \\    random_state: int,\\n):\\n    import numpy as np\\\
    n    import pandas as\\\n          \\ pd\\n    from sklearn.model_selection import\
    \ train_test_split\\n\\n    if\\\n          \\ not 0.0 < test_size < 1.0:\\n \
    \       raise ValueError(\\\"test_size must\\\n          \\ be between 0 and 1.\\\
    \")\\n\\n    frame = pd.read_csv(dataset.path)\\n    original_rows\\\n       \
    \   \\ = len(frame)\\n    frame = frame.replace([np.inf, -np.inf], np.nan).dropna().drop_duplicates()\\\
    n\\\n          \\    if frame.empty or frame[\\\"target\\\"].nunique() != 2:\\\
    n        raise\\\n          \\ ValueError(\\\"Cleaned dataset must contain both\
    \ target classes.\\\")\\n\\n\\\n          \\    train, test = train_test_split(\\\
    n        frame,\\n        test_size=test_size,\\n\\\n          \\        random_state=random_state,\\\
    n        stratify=frame[\\\"target\\\"],\\n\\\n          \\    )\\n\\n    for\
    \ artifact, split in [(train_dataset, train), (test_dataset,\\\n          \\ test)]:\\\
    n        split.to_csv(artifact.path, index=False)\\n        artifact.metadata[\\\
    \"\\\n          rows\\\"] = int(len(split))\\n        artifact.metadata[\\\"removed_rows\\\
    \"] =\\\n          \\ int(original_rows - len(frame))\\n    print(f\\\"Cleaned\
    \ {original_rows}\\\n          \\ -> {len(frame)} rows; train={len(train)}, test={len(test)}\\\
    \")\\n\\n\"\n        image: python:3.11-slim\n    exec-train-model:\n      container:\n\
    \        args:\n        - --executor_input\n        - '{{$}}'\n        - --function_to_execute\n\
    \        - train_model\n        command:\n        - sh\n        - -c\n       \
    \ - \"\\nif ! [ -x \\\"$(command -v pip)\\\" ]; then\\n    python3 -m ensurepip\
    \ ||\\\n          \\ python3 -m ensurepip --user || apt-get install python3-pip\\\
    nfi\\n\\nPIP_DISABLE_PIP_VERSION_CHECK=1\\\n          \\ python3 -m pip install\
    \ --quiet --no-warn-script-location 'pandas==2.2.3'\\\n          \\ 'scikit-learn==1.6.1'\
    \ 'joblib==1.4.2'  &&  python3 -m pip install --quiet\\\n          \\ --no-warn-script-location\
    \ 'kfp==2.18.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\\\n          \\ python_version<\\\
    \"3.9\\\"' && \\\"$0\\\" \\\"$@\\\"\\n\"\n        - sh\n        - -ec\n      \
    \  - 'program_path=$(mktemp -d)\n\n\n          printf \"%s\" \"$0\" > \"$program_path/ephemeral_component.py\"\
    \n\n          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main             \
    \            --component_module_path                         \"$program_path/ephemeral_component.py\"\
    \                         \"$@\"\n\n          '\n        - \"\\nimport kfp\\nfrom\
    \ kfp import dsl\\nfrom kfp.dsl import *\\nfrom typing import\\\n          \\\
    \ *\\n\\ndef train_model(\\n    train_dataset: Input[Dataset],\\n    model:\\\n\
    \          \\ Output[Model],\\n    max_depth: int,\\n    random_state: int,\\\
    n):\\n    import\\\n          \\ joblib\\n    import pandas as pd\\n    from sklearn.tree\
    \ import DecisionTreeClassifier\\n\\\n          \\n    train = pd.read_csv(train_dataset.path)\\\
    n    classifier = DecisionTreeClassifier(max_depth=max_depth,\\\n          \\\
    \ random_state=random_state)\\n    classifier.fit(train.drop(columns=[\\\"\\\n\
    \          target\\\"]), train[\\\"target\\\"])\\n    joblib.dump(classifier,\
    \ model.path)\\n\\\n          \\    model.metadata[\\\"framework\\\"] = \\\"scikit-learn\\\
    \"\\n    model.metadata[\\\"\\\n          model_type\\\"] = \\\"DecisionTreeClassifier\\\
    \"\\n    model.metadata[\\\"max_depth\\\"\\\n          ] = max_depth\\n\\n\"\n\
    \        image: python:3.11-slim\npipelineInfo:\n  description: Load, clean, split,\
    \ train and evaluate sklearn's breast cancer dataset.\n  name: breast-cancer-decision-tree\n\
    root:\n  dag:\n    tasks:\n      evaluate-model:\n        cachingOptions:\n  \
    \        enableCache: true\n        componentRef:\n          name: comp-evaluate-model\n\
    \        dependentTasks:\n        - preprocess-and-split\n        - train-model\n\
    \        inputs:\n          artifacts:\n            model:\n              taskOutputArtifact:\n\
    \                outputArtifactKey: model\n                producerTask: train-model\n\
    \            test_dataset:\n              taskOutputArtifact:\n              \
    \  outputArtifactKey: test_dataset\n                producerTask: preprocess-and-split\n\
    \        taskInfo:\n          name: evaluate-model\n      import-dataset:\n  \
    \      cachingOptions:\n          enableCache: true\n        componentRef:\n \
    \         name: comp-import-dataset\n        taskInfo:\n          name: import-dataset\n\
    \      preprocess-and-split:\n        cachingOptions:\n          enableCache:\
    \ true\n        componentRef:\n          name: comp-preprocess-and-split\n   \
    \     dependentTasks:\n        - import-dataset\n        inputs:\n          artifacts:\n\
    \            dataset:\n              taskOutputArtifact:\n                outputArtifactKey:\
    \ dataset\n                producerTask: import-dataset\n          parameters:\n\
    \            random_state:\n              componentInputParameter: random_state\n\
    \            test_size:\n              componentInputParameter: test_size\n  \
    \      taskInfo:\n          name: preprocess-and-split\n      train-model:\n \
    \       cachingOptions:\n          enableCache: true\n        componentRef:\n\
    \          name: comp-train-model\n        dependentTasks:\n        - preprocess-and-split\n\
    \        inputs:\n          artifacts:\n            train_dataset:\n         \
    \     taskOutputArtifact:\n                outputArtifactKey: train_dataset\n\
    \                producerTask: preprocess-and-split\n          parameters:\n \
    \           max_depth:\n              componentInputParameter: max_depth\n   \
    \         random_state:\n              componentInputParameter: random_state\n\
    \        taskInfo:\n          name: train-model\n  inputDefinitions:\n    parameters:\n\
    \      max_depth:\n        defaultValue: 5.0\n        isOptional: true\n     \
    \   parameterType: NUMBER_INTEGER\n      random_state:\n        defaultValue:\
    \ 42.0\n        isOptional: true\n        parameterType: NUMBER_INTEGER\n    \
    \  test_size:\n        defaultValue: 0.2\n        isOptional: true\n        parameterType:\
    \ NUMBER_DOUBLE\nschemaVersion: 2.1.0\nsdkVersion: kfp-2.18.0\n"
  submit_pipeline.py: "\"\"\"Submit the mounted pipeline and fail the Job if its run\
    \ does not succeed.\"\"\"\nimport logging\nimport os\nfrom pathlib import Path\n\
    \nimport kfp\nfrom kfp.client import ServiceAccountTokenVolumeCredentials\n\n\n\
    def main():\n    logging.basicConfig(level=logging.INFO)\n    credentials = None\n\
    \    if os.environ.get(\"KFP_AUTH_MODE\", \"none\") == \"token\":\n        credentials\
    \ = ServiceAccountTokenVolumeCredentials(\n            path=os.environ[\"KF_PIPELINES_SA_TOKEN_PATH\"\
    ]\n        )\n    client = kfp.Client(\n        host=os.environ[\"KFP_HOST\"],\n\
    \        namespace=os.environ[\"KFP_NAMESPACE\"],\n        credentials=credentials,\n\
    \    )\n    revision = Path(\"/pipeline/revision\").read_text().strip()\n    run\
    \ = client.create_run_from_pipeline_package(\n        pipeline_file=\"/pipeline/breast_cancer_pipeline.yaml\"\
    ,\n        experiment_name=\"breast-cancer-gitops\",\n        run_name=f\"breast-cancer-{revision[:12]}\"\
    ,\n        namespace=os.environ[\"KFP_NAMESPACE\"],\n        enable_caching=False,\n\
    \    )\n    print(f\"Submitted run {run.run_id}, source revision {revision}\"\
    , flush=True)\n    completed = client.wait_for_run_completion(\n        run_id=run.run_id,\
    \ timeout=1800, sleep_duration=10\n    )\n    if str(completed.state).lower()\
    \ != \"succeeded\":\n        raise RuntimeError(f\"Kubeflow run {run.run_id} ended\
    \ with state {completed.state}\")\n    print(f\"Run {run.run_id} succeeded\",\
    \ flush=True)\n\n\nif __name__ == \"__main__\":\n    main()\n"
